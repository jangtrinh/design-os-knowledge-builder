[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "design-os-knowledge-builder"
version = "1.0.0"
description = "Universal Multimodal Knowledge Pipeline, Auto-Research Loop, and Epistemic Stopping Gate for AI Coding Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jang", email = "jang@easeui.com" }
]
keywords = [
  "knowledge-base",
  "multimodal",
  "auto-research",
  "markdown",
  "ai-agents",
  "stopping-conditions",
  "epistemic-ledger"
]
dependencies = [
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]

[project.scripts]
knowledge-builder = "knowledge_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
