name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and pytest
        run: python -m pip install -e ".[dev]"
      - name: Full test suite (skill shape, contract, examples, look)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
      - name: Contract is current
        run: python scripts/generate-skill-contract.py --check
      - name: Repository self-check
        run: python scripts/self_check.py
